<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guest List Converter</title>
  <meta name="description" content="Convert a Luma guest export into a 6-column check-in sheet. Runs entirely in your browser.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='13' height='13' rx='3' fill='%234285F4'/%3E%3Crect x='17' y='2' width='13' height='13' rx='3' fill='%23EA4335'/%3E%3Crect x='2' y='17' width='13' height='13' rx='3' fill='%23FBBC04'/%3E%3Crect x='17' y='17' width='13' height='13' rx='3' fill='%2334A853'/%3E%3C/svg%3E">
</head>
<body>
  <div class="brand-bar" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <main class="container">
    <header class="hero">
      <h1>Guest List Converter</h1>
      <p class="lead">Drop in a Luma guest export. You get the original sheet plus a <strong>“Copy of …”</strong> sheet with just the 6 check-in columns.</p>
    </header>

    <section class="card" aria-labelledby="step1">
      <h2 id="step1"><span class="step step-blue">1</span>Upload the Luma CSV</h2>
      <label id="dropzone" class="dropzone" for="file">
        <input id="file" type="file" accept=".csv,text/csv">
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path fill="currentColor" d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        <span class="dz-title">Drag &amp; drop your CSV here</span>
        <span class="dz-sub">or <u>browse files</u></span>
        <span id="filename" class="dz-file" hidden></span>
      </label>
      <div class="field">
        <label for="venue">ticket_venue value</label>
        <input id="venue" type="text" value="In-person" autocomplete="off">
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <section id="result" class="card" aria-labelledby="step2" hidden>
      <h2 id="step2"><span class="step step-green">2</span>Download</h2>

      <div class="stats">
        <div class="stat"><span id="stat-total" class="stat-num">0</span><span class="stat-label">Guests</span></div>
        <div class="stat stat-true"><span id="stat-true" class="stat-num">0</span><span class="stat-label">Checked in (TRUE)</span></div>
        <div class="stat stat-false"><span id="stat-false" class="stat-num">0</span><span class="stat-label">Not checked in (FALSE)</span></div>
      </div>
      <p id="excluded-note" class="hint" hidden></p>

      <div class="actions">
        <button id="dl-xlsx" class="btn btn-primary" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
          Excel (.xlsx) · both sheets
        </button>
        <button id="dl-csv" class="btn btn-tonal" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
          CSV · copy only
        </button>
      </div>
      <p class="hint" id="sheet-names"></p>

      <h3>Preview <span class="muted" id="preview-note"></span></h3>
      <div class="table-wrap">
        <table id="preview"></table>
      </div>
    </section>

    <footer class="footer">Your file never leaves this browser — everything runs locally.</footer>
  </main>

  <script type="module" src="js/app.js?v=4"></script>
</body>
</html>
